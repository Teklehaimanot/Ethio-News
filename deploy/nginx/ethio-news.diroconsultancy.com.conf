# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
# After DNS A record ethio-news.diroconsultancy.com → server IP:
#   sudo certbot --nginx -d ethio-news.diroconsultancy.com

server {
    listen 80;
    server_name ethio-news.diroconsultancy.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
